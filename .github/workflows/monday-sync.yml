name: Monday sync & publish dashboard

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:             # "Run workflow" button for an instant sync
  push:
    branches: [main]             # republish when you upload files by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install openpyxl cryptography

      - name: Pull latest data from Monday.com
        if: github.event_name != 'push'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_IDS: ${{ vars.MONDAY_BOARD_IDS }}
        run: python monday_sync.py

      - name: Save updated data.xlsx to the repo
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data.xlsx)" ]; then
            git config user.name "monday-sync-bot"
            git config user.email "monday-sync-bot@users.noreply.github.com"
            git add data.xlsx
            git commit -m "Monday sync $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "No changes from Monday."
          fi

      - name: Build secure site (encrypt each portco's data with its PIN)
        env:
          PORTCO_ACCESS: ${{ secrets.PORTCO_ACCESS }}
        run: python build_secure.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site            # only the built site - data.xlsx and scripts are NOT published
      - id: deployment
        uses: actions/deploy-pages@v4
